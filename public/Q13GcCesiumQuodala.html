<!DOCTYPE html>
<html>
<body>

    <h2> Q1 3rd Graded Exercise submitted by Eliana Gabrielle Victoria M. Quodala of 9Cesium</h2>

    <p>Guess the number: ****</p>
    <p>The number is from 1 to 100</p>
    <label>Enter your guess : </label>
    <input id="guess" type="number" placeholder="Your guess!"> <br>
    <button onclick="checkIt()">Check It</button>
    <p id="checked"></p>

<script>
    var dNumber = Math.floor(Math.random() * 100) + 1; 

    function checkIt() {
        var guess = parseFloat(document.getElementById("guess").value);
        let resultElement = document.getElementById("checked");

        if (guess == dNumber) {
            resultElement.innerHTML = "Result: You are correct! :3";
        }

        if (guess > dNumber) {
            resultElement.innerHTML = "Result: Lower :(";
        }

        if (guess < dNumber) {
            resultElement.innerHTML = "Result: Higher :(";
        }
    }
</script>

</body>

</html>
